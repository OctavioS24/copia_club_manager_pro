name: Deploy to Vercel B
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        run: |
          git config --global user.email "plegma.caab@gmail.com"
          git config --global user.name "plegma-caab"
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --force
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

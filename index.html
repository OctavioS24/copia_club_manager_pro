
<!DOCTYPE html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Manager Plegma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: 'var(--primary-50)',
                100: 'var(--primary-100)',
                200: 'var(--primary-200)',
                300: 'var(--primary-300)',
                400: 'var(--primary-400)',
                500: 'var(--primary-500)',
                600: 'var(--primary-600)',
                700: 'var(--primary-700)',
                800: 'var(--primary-800)',
                900: 'var(--primary-900)',
                contrast: 'var(--text-on-primary)',
              },
              secondary: {
                50: 'var(--secondary-50)',
                100: 'var(--secondary-100)',
                200: 'var(--secondary-200)',
                300: 'var(--secondary-300)',
                400: 'var(--secondary-400)',
                500: 'var(--secondary-500)',
                600: 'var(--secondary-600)',
                700: 'var(--secondary-700)',
                800: 'var(--secondary-800)',
                900: 'var(--secondary-900)',
                contrast: 'var(--text-on-secondary)',
              },
              surface: {
                ground: 'var(--surface-ground)',
                card: 'var(--surface-card)',
                hover: 'var(--surface-card-hover)',
                border: 'var(--surface-border)',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='25' fill='%23ec4899'/&gt;&lt;path d='M50 15 L25 25 V50 C25 68 36 80 50 85 C64 80 75 68 75 50 V25 L50 15 Z' fill='white'/&gt;&lt;path d='M50 22 L31 30 V48 C31 62 40 73 50 78 C60 73 69 62 69 48 V30 L50 22 Z' fill='%230f172a'/&gt;&lt;text x='50' y='58' font-family='system-ui, sans-serif' font-size='32' font-weight='900' fill='white' text-anchor='middle'&gt;P&lt;/text&gt;&lt;/svg&gt;" />
    <link rel="shortcut icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='25' fill='%23ec4899'/&gt;&lt;path d='M50 15 L25 25 V50 C25 68 36 80 50 85 C64 80 75 68 75 50 V25 L50 15 Z' fill='white'/&gt;&lt;path d='M50 22 L31 30 V48 C31 62 40 73 50 78 C60 73 69 62 69 48 V30 L50 22 Z' fill='%230f172a'/&gt;&lt;text x='50' y='58' font-family='system-ui, sans-serif' font-size='32' font-weight='900' fill='white' text-anchor='middle'&gt;P&lt;/text&gt;&lt;/svg&gt;" />
    <script>
      // Actualización instantánea del favicon y título antes de que cargue la app
      try {
        const cachedLogo = localStorage.getItem('club_manager_custom_logo');
        const cachedName = localStorage.getItem('club_manager_custom_name');
        if (cachedLogo) {
          document.querySelectorAll("link[rel*='icon']").forEach(function(el){ el.remove(); });
          ['icon', 'shortcut icon', 'apple-touch-icon'].forEach(function(rel){
            var link = document.createElement('link');
            link.rel = rel;
            link.href = cachedLogo;
            document.head.appendChild(link);
          });
        }
        if (cachedName && cachedName !== 'MI CLUB') {
          document.title = cachedName + ' | Club Manager';
        }
      } catch (e) {}
    </script>
    <style>
      :root {
        /* Defaults en caso de que no carguen de DB */
        --primary-500: #ec4899;
        --secondary-500: #0f172a;
        --surface-ground: #f8fafc;
        --surface-card: #ffffff;
        --surface-border: rgba(0,0,0,0.05);
        --text-on-primary: #ffffff;
        --text-on-secondary: #ffffff;
      }
      
      .dark:root {
        --surface-ground: #080a0f;
        --surface-card: #0f1219;
        --surface-border: rgba(255,255,255,0.06);
      }
      body { font-family: 'Inter', sans-serif; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes shine {
        from { background-position: -200% center; }
        to { background-position: 200% center; }
      }
      .animate-shine {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        background-size: 200% 100%;
        animation: shine 1.5s infinite;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body class="bg-surface-ground text-slate-900 antialiased dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
